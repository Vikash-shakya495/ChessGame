
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess Game</title>
    <!-- Include chess.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.11.0/chess.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #status {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 4px solid #333;
        }
        .square {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }
        .light {
            background: #f0d9b5;
        }
        .dark {
            background: #b58863;
        }
        .selected {
            background: #00e5ff !important;
        }
        .move-highlight {
            position: relative;
        }
        /* Subtle dot highlight for possible legal moves */
        .move-highlight::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 255, 0, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status">White's Turn</div>
    <div class="board" id="board"></div>

    <script>
        // Initialize the chess.js game engine
        const game = new Chess();
        const boardElement = document.getElementById("board");
        let selectedSquare = null;

        // Map chess.js piece types and colors to unicode symbols
        const unicodePieces = {
            'w': { 'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔' },
            'b': { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚' }
        };

        // Convert algebraic coordinates (e.g., 'e4') to matrix row/col
        function algebraicToCoords(square) {
            const col = square.charCodeAt(0) - 97; // 'a' -> 0
            const row = 8 - parseInt(square[1]);  // '8' -> 0
            return { row, col };
        }

        // Convert matrix row/col to algebraic coordinates (e.g., 'e4')
        function coordsToAlgebraic(row, col) {
            const file = String.fromCharCode(97 + col);
            const rank = 8 - row;
            return file + rank;
        }

        // Render the board layout dynamically based on the game state
        function renderBoard() {
            boardElement.innerHTML = "";
            const currentBoard = game.board(); // 8x8 array representation from chess.js

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareElement = document.createElement("div");
                    squareElement.classList.add("square");
                    
                    // Alternating background colors
                    if ((row + col) % 2 === 0) {
                        squareElement.classList.add("light");
                    } else {
                        squareElement.classList.add("dark");
                    }

                    squareElement.dataset.row = row;
                    squareElement.dataset.col = col;

                    // Place the piece if one exists on this square
                    const piece = currentBoard[row][col];
                    if (piece) {
                        squareElement.textContent = unicodePieces[piece.color][piece.type];
                    } else {
                        squareElement.textContent = "";
                    }

                    squareElement.addEventListener("click", handleClick);
                    boardElement.appendChild(squareElement);
                }
            }
            updateStatus();
        }

        // Highlight selected square and valid destination moves
        function highlightSquares() {
            // Clear prior highlights
            document.querySelectorAll(".square").forEach(s => {
                s.classList.remove("selected", "move-highlight");
            });

            if (!selectedSquare) return;

            // Highlight selected piece
            const selectCoords = algebraicToCoords(selectedSquare);
            const selectedElement = document.querySelector(`[data-row='${selectCoords.row}'][data-col='${selectCoords.col}']`);
            if (selectedElement) selectedElement.classList.add("selected");

            // Get valid moves specifically for the selected piece
            const moves = game.moves({ square: selectedSquare, verbose: true });
            moves.forEach(move => {
                const moveCoords = algebraicToCoords(move.to);
                const targetElement = document.querySelector(`[data-row='${moveCoords.row}'][data-col='${moveCoords.col}']`);
                if (targetElement) targetElement.classList.add("move-highlight");
            });
        }

        // Handle user click interaction
        function handleClick(e) {
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            const squareSquare = coordsToAlgebraic(row, col);
            const piece = game.get(squareSquare);

            // 1. If clicking the already selected piece, deselect it
            if (selectedSquare === squareSquare) {
                selectedSquare = null;
                highlightSquares();
                return;
            }

            // 2. Try to process a move if a piece is already selected
            if (selectedSquare) {
                // Check if the click is a valid legal move destination
                const moves = game.moves({ square: selectedSquare, verbose: true });
                const isValidMove = moves.some(m => m.to === squareSquare);

                if (isValidMove) {
                    // Execute the move (handles auto-promotion to Queen for simplicity)
                    game.move({
                        from: selectedSquare,
                        to: squareSquare,
                        promotion: 'q' 
                    });
                    selectedSquare = null;
                    renderBoard();
                    return;
                }
            }

            // 3. Select a piece if it belongs to the active turn player
            if (piece && piece.color === game.turn()) {
                selectedSquare = squareSquare;
                highlightSquares();
            } else {
                // Clicked an empty square or enemy piece without making a legal move
                selectedSquare = null;
                highlightSquares();
            }
        }

        // Update the display text for turns and game-over states
        function updateStatus() {
            const statusElement = document.getElementById("status");
            let statusText = game.turn() === 'w' ? "White's Turn" : "Black's Turn";

            if (game.in_checkmate()) {
                statusText = `Game Over! ${game.turn() === 'w' ? 'Black' : 'White'} wins by Checkmate!`;
            } else if (game.in_draw()) {
                statusText = "Game Over! Draw (Stalemate, 50-move rule, or Repetition).";
            } else if (game.in_check()) {
                statusText += " (In Check!)";
            }

            statusElement.innerText = statusText;
        }

        // Initialize display on startup
        renderBoard();
    </script>
</body>
</html>
